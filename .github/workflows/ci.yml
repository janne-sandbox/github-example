name: Application CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform test

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package backend
        run: mvn --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        with:
          name: example-backend
          path: example-backend/target/example-backend-*.jar
          if-no-files-found: error

  frontend:
    name: Frontend audit, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: example-frontend/package-lock.json
      - run: npm ci
      - name: Reject critical dependency advisories
        run: npm audit --audit-level=critical
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: example-frontend
          path: example-frontend/dist/example-frontend/browser
          if-no-files-found: error
