name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'documentation/**'
      - '.github/workflows/azure-static-web-apps-icy-river-0739e4a03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy documentation
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_RIVER_0739E4A03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: documentation
          api_location: ''
          output_location: ''
          skip_app_build: true
