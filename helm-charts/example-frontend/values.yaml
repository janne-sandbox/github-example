replicaCount: 1
image:
  repository: ghcr.io/example/github-example-frontend
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
backend:
  restBaseUrl: https://api.example.com
  webSocketBaseUrl: wss://api.example.com
  reconnectDelayMs: 1000
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
