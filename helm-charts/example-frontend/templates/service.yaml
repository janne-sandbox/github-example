apiVersion: v1
kind: Service
metadata:
  name: {{ include "example-frontend.fullname" . }}
  labels: {{- include "example-frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports: [{ name: http, port: {{ .Values.service.port }}, targetPort: http }]
  selector: {{- include "example-frontend.labels" . | nindent 4 }}
