apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "example-backend.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "example-backend.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "example-backend.labels" . | nindent 8 }}
      {{- if .Values.vault.enabled }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-application.properties: {{ printf "secret/data/%s" .Values.vault.path | quote }}
      {{- end }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: example-backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: FRONTEND_ORIGIN, value: {{ .Values.frontendOrigin | quote }} }
          livenessProbe:
            httpGet: { path: {{ .Values.probes.liveness.path }}, port: 8080 }
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          readinessProbe:
            httpGet: { path: {{ .Values.probes.readiness.path }}, port: 8080 }
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
