replicaCount: 1
image:
  repository: ghcr.io/example/github-example-backend
  tag: "1.0.0-SNAPSHOT"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
frontendOrigin: https://frontend.example.com
vault:
  enabled: false
  role: ""
  path: ""
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi
probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 30
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 10
